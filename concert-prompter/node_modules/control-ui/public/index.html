<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concert Prompter Control</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <h1>Concert Prompter Control</h1>
        <p>오퍼레이터 제어 화면</p>
      </div>
      <div id="connectionStatus" class="status">연결 대기</div>
    </header>

    <section class="panel">
      <label for="songSelect">곡 선택</label>
      <select id="songSelect"></select>
    </section>

    <section class="now-panel">
      <div class="meta">
        <span id="songTitle">-</span>
        <span id="lineCounter">0 / 0</span>
      </div>

      <div class="current-box">
        <div class="label">현재 가사</div>
        <div id="currentLyric" class="current">-</div>
      </div>

      <div class="next-box">
        <div class="label">다음 가사</div>
        <div id="nextLyric" class="next">-</div>
      </div>
    </section>

    <section class="buttons">
      <button id="prevButton" type="button">이전 줄</button>
      <button id="nextButton" type="button" class="primary">다음 줄</button>
      <button id="blankOnButton" type="button" class="danger">빈 화면 ON</button>
      <button id="blankOffButton" type="button">빈 화면 OFF</button>
    </section>

    <section class="panel">
      <h2>전체 가사</h2>
      <ol id="lyricsList" class="lyrics-list"></ol>
    </section>

    <section class="panel editor-panel">
      <div class="section-header">
        <h2>가사 편집</h2>
        <span id="saveStatus" class="save-status">저장 대기</span>
      </div>

      <div class="form-grid">
        <label>
          곡 제목
          <input id="editTitle" type="text" />
        </label>
        <label>
          아티스트
          <input id="editArtist" type="text" />
        </label>
      </div>

      <label for="editLyrics">가사</label>
      <textarea id="editLyrics" rows="10" placeholder="한 줄에 가사 한 줄씩 입력"></textarea>

      <div class="editor-actions">
        <button id="resetEditButton" type="button">되돌리기</button>
        <button id="saveEditButton" type="button" class="primary">저장</button>
      </div>
    </section>

    <section class="links">
      <a href="http://localhost:3001" target="_blank">관객용 화면 열기</a>
      <a href="http://localhost:3002" target="_blank">가수용 화면 열기</a>
    </section>
  </main>

  <script src="http://localhost:4000/socket.io/socket.io.js"></script>
  <script src="./app.js"></script>
</body>
</html>
