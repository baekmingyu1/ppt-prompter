<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concert Prompter Control</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <h1>Concert Prompter Control</h1>
        <p>오퍼레이터 제어 화면</p>
      </div>
      <div id="connectionStatus" class="status">연결 대기</div>
    </header>

    <section class="panel">
      <div class="song-toolbar">
        <label for="songSelect">곡 선택</label>
        <a class="button-link" href="./edit.html">가사 편집</a>
      </div>
      <select id="songSelect"></select>
    </section>

    <section class="now-panel">
      <div class="meta">
        <span id="songTitle">-</span>
        <span id="lineCounter">0 / 0</span>
      </div>

      <div class="current-box">
        <div class="label">현재 가사</div>
        <div id="currentLyric" class="current">-</div>
      </div>

      <div class="next-box">
        <div class="label">다음 가사</div>
        <div id="nextLyric" class="next">-</div>
      </div>
    </section>

    <section class="buttons">
      <button id="prevButton" type="button">이전 줄</button>
      <button id="nextButton" type="button" class="primary">다음 줄</button>
      <button id="blankOnButton" type="button" class="danger">빈 화면 ON</button>
      <button id="blankOffButton" type="button">빈 화면 OFF</button>
    </section>

    <section class="panel">
      <div class="section-header">
        <h2>가사 표시 설정</h2>
        <span id="displayStatus" class="save-status">설정 대기</span>
      </div>

      <div class="settings-grid">
        <label>
          폰트 크기
          <div class="range-control">
            <input id="fontSizeInput" type="range" min="3" max="12" step="0.5" />
            <span id="fontSizeValue">6vw</span>
          </div>
        </label>

        <label>
          폰트 색상
          <input id="fontColorInput" type="color" />
        </label>

        <label>
          가사 노출 기준
          <select id="lineCountSelect">
            <option value="1">1줄씩 표시</option>
            <option value="2">2줄씩 표시</option>
            <option value="3">3줄씩 표시</option>
            <option value="4">4줄씩 표시</option>
          </select>
        </label>
      </div>
    </section>

    <section class="panel">
      <h2>전체 가사</h2>
      <ol id="lyricsList" class="lyrics-list"></ol>
    </section>

    <section class="links">
      <a id="audienceLink" href="http://localhost:3001" target="_blank">관객용 화면 열기</a>
      <a id="singerLink" href="http://localhost:3002" target="_blank">가수용 화면 열기</a>
    </section>
  </main>

  <script src="./config.js"></script>
  <script>
    const socketScript = document.createElement('script');
    const isLocalDev = ['localhost', '127.0.0.1'].includes(window.location.hostname) && window.location.port !== '4000';
    const basePath = window.location.pathname.split('/').filter(Boolean)[0] === 'prompter' ? '/prompter' : '';
    const backendUrl = window.PROMPTER_CONFIG?.backendUrl || '';
    const socketPath = window.PROMPTER_CONFIG?.socketPath || `${basePath}/socket.io`;
    socketScript.src = isLocalDev
      ? 'http://localhost:4000/socket.io/socket.io.js'
      : `${backendUrl}${socketPath}/socket.io.js`;
    socketScript.onload = () => {
      const appScript = document.createElement('script');
      appScript.src = './app.js';
      document.body.appendChild(appScript);
    };
    document.body.appendChild(socketScript);
  </script>
</body>
</html>
