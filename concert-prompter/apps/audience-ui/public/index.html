<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audience Lyrics Screen</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="screen">
    <div id="lyric" class="lyric"></div>
  </main>

  <script>
    const socketScript = document.createElement('script');
    const isLocalDev = ['localhost', '127.0.0.1'].includes(window.location.hostname) && window.location.port !== '4000';
    const basePath = window.location.pathname.split('/').filter(Boolean)[0] === 'prompter' ? '/prompter' : '';
    socketScript.src = isLocalDev ? 'http://localhost:4000/socket.io/socket.io.js' : `${basePath}/socket.io/socket.io.js`;
    socketScript.onload = () => {
      const appScript = document.createElement('script');
      appScript.src = './app.js';
      document.body.appendChild(appScript);
    };
    document.body.appendChild(socketScript);
  </script>
</body>
</html>
