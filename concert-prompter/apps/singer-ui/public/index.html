<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Singer Prompter Screen</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="screen">
    <div id="lyricLayout" class="lyric-layout">
      <section class="current-section">
        <div class="label">CURRENT</div>
        <div id="currentLyric" class="current-lyric"></div>
      </section>

      <section class="next-section">
        <div class="label">NEXT</div>
        <div id="nextLyric" class="next-lyric"></div>
      </section>
    </div>

    <img id="pptSlide" class="ppt-slide" alt="PPT slide" hidden />
    <video id="videoPlayer" class="video-player" playsinline controls hidden></video>
    <iframe id="youtubePlayer" class="youtube-player" title="YouTube video" allow="autoplay; fullscreen; encrypted-media" allowfullscreen hidden></iframe>
  </main>

  <script src="/config.js"></script>
  <script>
    document.write(`<script src="${window.__PROMPTER_CONFIG__?.lyricsServiceUrl || ''}/socket.io/socket.io.js"><\/script>`);
  </script>
  <script src="./app.js?v=youtube-link-1"></script>
</body>
</html>
