name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docker-build:
    name: Build & smoke-test image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: concert-prompter
          push: false
          load: true
          tags: ppt-prompter:ci

      - name: Run container
        run: |
          docker run -d --name app -p 4000:4000 ppt-prompter:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health >/dev/null 2>&1; then
              echo "health up after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Smoke-test routes
        run: |
          set -euxo pipefail
          curl -fsS http://localhost:4000/health | grep -q '"service":"lyrics-service"'
          curl -fsS http://localhost:4000/singer/   | grep -qi '<html'
          curl -fsS http://localhost:4000/audience/ | grep -qi '<html'
          curl -fsS http://localhost:4000/control/  | grep -qi '<html'
          curl -fsS http://localhost:4000/config.js | grep -q '__PROMPTER_CONFIG__'

      - name: Container logs on failure
        if: failure()
        run: docker logs app || true
